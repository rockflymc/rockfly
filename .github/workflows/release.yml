name: Production Release Pipeline (1.0)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build Multiplatform Binaries (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows, arch: amd64, ext: .exe }
          - { os: linux, arch: amd64, ext: "" }
          - { os: linux, arch: arm64, ext: "" }
          - { os: darwin, arch: amd64, ext: "" }
          - { os: darwin, arch: arm64, ext: "" }
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Rockfly Server (${{ matrix.target.os }}/${{ matrix.target.arch }})
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p dist
          SERVER_BIN="dist/rockfly-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}"
          CLI_BIN="dist/rockfly-cli-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name || inputs.version }}" -o "$SERVER_BIN" ./cmd/rockfly
          go build -trimpath -ldflags="-s -w -X main.CLIVersion=${{ github.ref_name || inputs.version }}" -o "$CLI_BIN" ./cmd/rockfly-cli

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*
          retention-days: 1

  publish-github-release:
    name: Package Distribution & Publish GitHub Release
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums & Release Archives
        run: |
          mkdir -p release-pkg
          cd release-assets
          sha256sum * > ../release-pkg/SHA256SUMS.txt
          mv * ../release-pkg/
          cd ../release-pkg
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: "Rockfly ${{ github.ref_name || inputs.version }} - Production 1.0 Release"
          draft: false
          prerelease: false
          files: release-pkg/*
          generate_release_notes: true
