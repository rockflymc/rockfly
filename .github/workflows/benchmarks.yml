name: Performance Regression & Benchmarks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  benchmarks:
    name: High-Throughput Subsystem Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Benchmark Spatial Hash Entity Queries
        run: go test -v -run=^$ -bench=BenchmarkSpatialHash ./server/entity/... -benchmem || true

      - name: Benchmark Starlight Light Propagation
        run: go test -v -run=^$ -bench=BenchmarkStarlight ./server/world/... -benchmem || true

      - name: Benchmark SIMD Noise Evaluation
        run: go test -v -run=^$ -bench=BenchmarkNoise ./server/world/generator/... -benchmem || true

      - name: Benchmark Hopper Optimization Sleep Cycles
        run: go test -v -run=^$ -bench=BenchmarkHopper ./server/block/... -benchmem || true

      - name: Benchmark TypeScript Transpilation Speed (<5ms)
        run: go test -v -run=TestTranspiler_TranspileSpeed ./server/plugin/ts/...

      - name: Benchmark Wazero 10k Block Batch Commit (<2ms)
        run: go test -v -run=TestWASMPlugin_10kBlockMutationsGoGuest ./server/plugin/wasm/...
